<div class="modal-backdrop" (click)="closeModal()"></div>

<div class="password-modal">
  <h2>Change Password</h2>

  <div class="form-group">
    <label>Old Password</label>
    <input type="password" [(ngModel)]="oldPassword" />
  </div>

  <div class="form-group">
    <label>New Password</label>
    <input type="password" [(ngModel)]="newPassword" />
    <small class="hint">At least 8 characters & 2 English letters</small>
  </div>

  <div class="form-group">
    <label>Confirm Password</label>
    <input type="password" [(ngModel)]="confirmPassword" />
  </div>

  <button class="save-btn" (click)="changePassword()" [disabled]="loading">
    {{ loading ? 'Updating...' : 'Change Password' }}
  </button>

  <button class="cancel-btn" (click)="closeModal()">
    Cancel
  </button>

  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>
