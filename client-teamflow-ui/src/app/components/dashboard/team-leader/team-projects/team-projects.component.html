<div class="my-projects-wrapper" *ngIf="!loading; else loadingTpl">
  <h2 class="title">My Projects</h2>

  <div *ngIf="error" class="error-msg">{{ error }}</div>

  <div class="projects-grid" *ngIf="projects.length > 0; else noProjectsTpl">

    <div class="project-card" *ngFor="let p of projects">
      <h3>{{ p.name }}</h3>

      <p class="desc">
        {{ p.description || 'No description available.' }}
      </p>

      <div class="progress-bar">
        <div
          class="progress"
          [style.width.%]="p.progress"
          [style.background]="getProgressColor(p.progress)">
        </div>
      </div>

      <div class="row">
        <span class="label">Status:</span>
        <span>{{ p.status }}</span>
      </div>

      <div class="row">
        <span class="label">Leader:</span>
        <span>{{ p.leaderName }}</span>
      </div>

      <div class="actions">
        <button class="edit-btn" (click)="openEdit(p)">Edit</button>
      </div>

    </div>
  </div>
</div>

<!-- עריכה -->
<div class="edit-overlay" *ngIf="showEditForm && editingProject">
  <div class="edit-panel">

    <h3>Edit Project</h3>

    <div class="form-group">
      <label>Name</label>
      <input type="text" [(ngModel)]="editingProject.name">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea [(ngModel)]="editingProject.description"></textarea>
    </div>

    <div class="form-group">
      <label>Start Date</label>
      <input type="date" [(ngModel)]="editingProject.startDate">
    </div>

    <div class="form-group">
      <label>End Date</label>
      <input type="date" [(ngModel)]="editingProject.endDate">
    </div>

    <div class="form-group">
      <label>Status</label>
      <select [(ngModel)]="editingProject.status">
        <option value="ACTIVE">Active</option>
        <option value="COMPLETED">Completed</option>
        <option value="ON_HOLD">On Hold</option>
      </select>
    </div>

    <div class="form-group">
      <label>Progress (0–100)</label>
      <input type="number" min="0" max="100" [(ngModel)]="editingProject.progress">
    </div>

    <div class="actions-row">
      <button class="save-btn" (click)="updateProject()" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save' }}
      </button>

      <button class="cancel-btn" (click)="cancelEdit()">
        Cancel
      </button>
    </div>

  </div>
</div>

<!-- תבניות מצב -->
<ng-template #loadingTpl>
  <div class="loading">Loading projects...</div>
</ng-template>

<ng-template #noProjectsTpl>
  <div class="no-projects">No projects assigned to you.</div>
</ng-template>
