<div class="page-title">Team Meetings</div>

<button class="add-btn" (click)="toggleAddForm()">+ Add Meeting</button>

<!-- Add Meeting Form -->
<div class="add-form" *ngIf="showAddForm">

  <h3>Create Meeting</h3>

  <div class="form-row">
    <label>Project</label>
    <select [(ngModel)]="newMeeting.projectId">
      <option value="0">Select Project...</option>
      <option *ngFor="let p of leaderProjects" [value]="p.id">
        {{ p.name }}
      </option>
    </select>
  </div>

  <div class="form-row">
    <label>Title</label>
    <input type="text" [(ngModel)]="newMeeting.title">
  </div>

  <div class="form-row">
    <label>Date</label>
    <input type="date" [(ngModel)]="newMeeting.meetingDate">
  </div>

  <div class="form-row">
    <label>Location</label>
    <input type="text" [(ngModel)]="newMeeting.meetingLocation">
  </div>

  <div class="form-row">
    <label>Description</label>
    <textarea [(ngModel)]="newMeeting.description"></textarea>
  </div>

  <div class="form-actions">
    <button class="save-btn" (click)="createMeeting()">Create</button>
    <button class="cancel-btn" (click)="toggleAddForm()">Cancel</button>
  </div>
</div>

<!-- MEETING CARDS -->
<div class="meetings-list">
  <div class="meeting-card" *ngFor="let m of meetings">

    <div class="meeting-header">
      <h4>{{ m.title }}</h4>
      <span class="status" [ngClass]="m.status?.toUpperCase()">
        {{ m.status | uppercase }}
      </span>
    </div>

    <div class="info-row">
      <b>Project:</b> {{ m.projectId }}
    </div>

    <div class="info-row">
      <b>Date:</b> {{ m.meetingDate }}
    </div>

    <div class="info-row" *ngIf="m.meetingLocation">
      <b>Location:</b> {{ m.meetingLocation }}
    </div>

    <p class="desc">{{ m.description }}</p>

  </div>
</div>

<!-- Toast Notification -->
<div class="toast" *ngIf="toastVisible" [ngClass]="toastType">
  {{ toastMessage }}
</div>
