<div class="add-report-container">
  <h2 class="title">Add New Report</h2>

  <form (ngSubmit)="submitReport()" #reportForm="ngForm" class="report-form">

    <div class="form-group">
      <label for="project">Select Project:</label>
      <select id="project" [(ngModel)]="selectedProjectId" name="project" required>
        <option [value]="null" disabled selected>-- Select a Project --</option>
        <option *ngFor="let p of projects" [value]="p.id">{{ p.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="title">Report Title:</label>
      <input
        id="title"
        type="text"
        [(ngModel)]="title"
        name="title"
        required
      />
    </div>

    <div class="form-group">
      <label>Description:</label>
      <textarea
        [(ngModel)]="description"
        name="description"
        required
      ></textarea>
    </div>

    <div class="form-group">
      <label>Status:</label>
      <select [(ngModel)]="status" name="status">
        <option value="IN_REVIEW">In Review</option>
        <option value="APPROVED">Approved</option>
        <option value="REJECTED">Rejected</option>
      </select>
    </div>

    <div class="form-group">
      <label>Hours Worked:</label>
      <input
        type="number"
        min="1"
        max="12"
        [(ngModel)]="hours"
        name="hours"
      />
    </div>

    <button type="submit" [disabled]="loading">Submit Report</button>

  </form>
</div>

<!-- ========================= TOAST ========================= -->
<div class="toast"
     *ngIf="toastVisible"
     [class.toast-success]="toastType === 'success'"
     [class.toast-error]="toastType === 'error'">
  {{ toastMessage }}
</div>
