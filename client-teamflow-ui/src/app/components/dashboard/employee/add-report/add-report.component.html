<div class="add-report-container">
  <h2 class="title">Add New Report</h2>

  <form
    class="report-form"
    #reportForm="ngForm"
    (ngSubmit)="submitReport(reportForm)"
  >

    <!-- PROJECT -->
    <div class="form-group">
      <label for="project">Select Project:</label>
      <select
        id="project"
        name="project"
        [(ngModel)]="selectedProjectId"
        required
        #projectCtrl="ngModel"
        [ngClass]="{
          'invalid-field':
            (reportForm.submitted || projectCtrl.touched) && projectCtrl.invalid
        }"
      >
        <option [ngValue]="null">-- Select a Project --</option>
        <option *ngFor="let p of projects" [ngValue]="p.id">
          {{ p.name }}
        </option>
      </select>

      <small
        class="error"
        *ngIf="(reportForm.submitted || projectCtrl.touched) && projectCtrl.invalid"
      >
        Please select a project.
      </small>
    </div>

    <!-- TITLE -->
    <div class="form-group">
      <label for="title">Report Title:</label>
      <input
        id="title"
        type="text"
        name="title"
        [(ngModel)]="title"
        required
        minlength="3"
        maxlength="50"
        #titleCtrl="ngModel"
        [ngClass]="{
          'invalid-field':
            (reportForm.submitted || titleCtrl.touched) && titleCtrl.invalid
        }"
      />

      <small
        class="error"
        *ngIf="(reportForm.submitted || titleCtrl.touched) && titleCtrl.errors?.['required']"
      >
        Title is required.
      </small>

      <small
        class="error"
        *ngIf="(reportForm.submitted || titleCtrl.touched) && titleCtrl.errors?.['minlength']"
      >
        Title must be at least 3 characters.
      </small>

      <small
        class="error"
        *ngIf="(reportForm.submitted || titleCtrl.touched) && titleCtrl.errors?.['maxlength']"
      >
        Title cannot be longer than 50 characters.
      </small>
    </div>

    <!-- DESCRIPTION -->
    <div class="form-group">
      <label for="description">Description:</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="description"
        required
        minlength="10"
        #descCtrl="ngModel"
        [ngClass]="{
          'invalid-field':
            (reportForm.submitted || descCtrl.touched) && descCtrl.invalid
        }"
      ></textarea>

      <small
        class="error"
        *ngIf="(reportForm.submitted || descCtrl.touched) && descCtrl.errors?.['required']"
      >
        Description is required.
      </small>

      <small
        class="error"
        *ngIf="(reportForm.submitted || descCtrl.touched) && descCtrl.errors?.['minlength']"
      >
        Description must be at least 10 characters.
      </small>
    </div>

    <!-- HOURS -->
    <div class="form-group">
      <label for="hours">Hours Worked:</label>
      <input
        id="hours"
        type="number"
        name="hours"
        [(ngModel)]="hours"
        required
        min="1"
        max="12"
        #hoursCtrl="ngModel"
        [ngClass]="{
          'invalid-field':
            (reportForm.submitted || hoursCtrl.touched) &&
            (hoursCtrl.invalid || !isHoursRangeValid())
        }"
      />

      <small
        class="error"
        *ngIf="(reportForm.submitted || hoursCtrl.touched) && hoursCtrl.errors?.['required']"
      >
        Hours are required.
      </small>

      <small
        class="error"
        *ngIf="(reportForm.submitted || hoursCtrl.touched) && !hoursCtrl.errors && !isHoursRangeValid()"
      >
        Hours must be between 1 and 12.
      </small>
    </div>

    <!-- SUBMIT BUTTON -->
    <button type="submit" [disabled]="loading">
      {{ loading ? 'Submitting...' : 'Submit Report' }}
    </button>

  </form>
</div>

<!-- ========================= TOAST ========================= -->
<div
  class="toast"
  *ngIf="toastVisible"
  [class.toast-success]="toastType === 'success'"
  [class.toast-error]="toastType === 'error'"
>
  {{ toastMessage }}
</div>
